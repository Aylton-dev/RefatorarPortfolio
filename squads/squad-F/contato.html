<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Entre em contato com o Squad F para conversar sobre projetos, dúvidas e oportunidades."
    />
    <title>Contato | Squad F</title>
    <link rel="stylesheet" href="./styles/contato.css" />
    <link rel="stylesheet" href="./assets/chatbot.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="logo">
        <a href="index.html" aria-label="Ir para a página inicial">Squad F</a>
      </div>

      <nav class="main-nav" aria-label="Navegação principal">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html" class="active" aria-current="page">Contato</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li><a href="habilidades.html">Habilidades</a></li>
          <li><a href="servicos.html">Serviços</a></li>
          <li><a href="depoimentos.html">Depoimentos</a></li>
          <li><a href="case-de-sucesso.html">Case de Sucesso</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section class="section-projetos-intro" aria-labelledby="titulo-contato">
        <h1 id="titulo-contato">Vamos Conversar?</h1>
        <p>
          Tem um projeto em mente ou quer tirar uma dúvida? Preencha o formulário abaixo.
        </p>
      </section>

      <section class="form-section" aria-label="Formulário de contato">
        <div class="project-card">
          <form action="mailto:seuemail@exemplo.com" method="post" enctype="text/plain">
            <div>
              <label for="nome">Nome Completo</label>
              <input type="text" id="nome" name="nome" required placeholder="Digite seu nome" />
            </div>

            <div>
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" required placeholder="Digite seu e-mail" />
            </div>

            <div>
              <label for="mensagem">Mensagem</label>
              <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Como podemos ajudar?"></textarea>
            </div>

            <button type="submit">Enviar Mensagem</button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <p><small>Todos os direitos reservados | 2025</small></p>
    </footer>
    <script type="module" src="./assets/chatbot.js"></script>
  </body>
</html>
